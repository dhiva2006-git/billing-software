{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Login to ShopBill Pro — Professional Billing Software">
    <title>Login — ShopBill Pro</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="login-page">
        <div class="login-card">
            <div class="login-logo">
                <div class="login-logo-icon">
                    <i class="fas fa-bolt"></i>
                </div>
                <h1 class="login-title">ShopBill Pro</h1>
                <p class="login-subtitle">Sign in to your account</p>
            </div>

            {% if form.errors %}
                <div class="login-error">
                    <i class="fas fa-exclamation-circle"></i>
                    Invalid username or password. Please try again.
                </div>
            {% endif %}

            <form method="post" class="login-form" id="login-form">
                {% csrf_token %}
                <div class="form-group">
                    <label class="form-label" for="id_username">
                        <i class="fas fa-user"></i> Username
                    </label>
                    <input type="text" name="username" id="id_username" class="form-input"
                           placeholder="Enter your username" required autofocus autocomplete="username">
                </div>
                <div class="form-group">
                    <label class="form-label" for="id_password">
                        <i class="fas fa-lock"></i> Password
                    </label>
                    <input type="password" name="password" id="id_password" class="form-input"
                           placeholder="Enter your password" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary" id="login-submit">
                    <i class="fas fa-right-to-bracket"></i> Sign In
                </button>
            </form>

            <p style="text-align: center; margin-top: 24px; font-size: 12px; color: var(--text-muted);">
                &copy; 2026 ShopBill Pro. All rights reserved.
            </p>
        </div>
    </div>
</body>
</html>
